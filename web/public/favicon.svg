<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <linearGradient id="luma-badge-grad" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD60A" />
      <stop offset="55%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#FF6B2B" />
    </linearGradient>
  </defs>
  
  <!-- Neo-brutalist Hard Black Shadow -->
  <rect x="16" y="16" width="70" height="70" rx="14" fill="#0A0A0A" />
  
  <!-- Badge Card with thick border -->
  <rect x="10" y="10" width="70" height="70" rx="14" fill="url(#luma-badge-grad)" stroke="#0A0A0A" stroke-width="3.5" />
  
  <!-- Stylized Brutalist "L" (Black) -->
  <path d="M 21 21 H 32 V 53 H 53 V 63 H 21 Z" fill="#0A0A0A" />
  
  <!-- Hot Coral Play Triangle (Listener / Player) -->
  <polygon points="36,27 53,38 36,49" fill="#FF3D5A" stroke="#0A0A0A" stroke-width="2.75" stroke-linejoin="round" />
  <!-- Inner yellow warm highlight inside play triangle -->
  <polygon points="40,32 48,38 40,44" fill="#FFD60A" />

  <!-- Dynamic Audio Sound Waves Radiating Outward -->
  <!-- Wave Arc 1 -->
  <path d="M 58 29 C 62 33, 62 43, 58 47" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" />
  <!-- Wave Arc 2 -->
  <path d="M 65 23 C 71 30, 71 46, 65 53" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" />
</svg>